name: MSIX Packaging

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

jobs:
  package-uwp:
    name: Package UWP App
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet packages
      run: msbuild -t:Restore TPFan.sln

    - name: Build UWP app
      run: msbuild TPFan.UWP/TPFan.UWP.csproj /p:Configuration=${{ env.BUILD_TYPE }} /p:Platform=x64 /p:AppxPackageSigningEnabled=false

    - name: Create MSIX package
      run: |
        msbuild TPFan.UWP/TPFan.UWP.csproj `
          /p:Configuration=${{ env.BUILD_TYPE }} `
          /p:Platform=x64 `
          /p:AppxPackageSigningEnabled=true `
          /p:PackageCertificateKeyFile=certificate.pfx `
          /p:PackageCertificatePassword="${{ secrets.CERTIFICATE_PASSWORD }}" `
          /p:AppxPackageDir=.\AppxPackages\
      continue-on-error: true  # Will fail without certificate

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: MSIX-Package
        path: TPFan.UWP/AppxPackages/**/*.msix
        retention-days: 90

    - name: Upload appxupload
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Appx-Upload-Package
        path: TPFan.UWP/AppxPackages/**/*.appxupload
        retention-days: 90

  package-service:
    name: Package Background Service
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish Service (Release)
      run: |
        dotnet publish TPFan.Service/TPFan.Service.csproj `
          --configuration ${{ env.BUILD_TYPE }} `
          --runtime win10-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish/service

    - name: Create ZIP archive
      run: Compress-Archive -Path ./publish/service/* -DestinationPath TPFan-Win-Service.zip

    - name: Upload Service artifact
      uses: actions/upload-artifact@v4
      with:
        name: Service-Package
        path: TPFan-Win-Service.zip
        retention-days: 90

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package-uwp, package-service]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/MSIX-Package/*.msix
          artifacts/Service-Package/*.zip
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
